<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text ↔ Encrypted PNG</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

textarea {
    width: 100%;
    height: 150px;
}

canvas {
    border: 1px solid black;
    image-rendering: pixelated;
    width: 400px;
    height: 400px;
    display: block;
    margin-top: 20px;
}

button {
    margin: 5px;
    padding: 8px 12px;
}

#output {
    border: 1px solid #ccc;
    padding: 10px;
    min-height: 80px;
    white-space: pre-wrap;
}
</style>
</head>
<body>

<h1>Text ↔ Encrypted PNG</h1>

<textarea id="inputText" placeholder="Enter text here"></textarea>

<br>

<button onclick="encodeText()">Encode</button>
<button onclick="run()">Run Image</button>
<button onclick="decodeImage()">Decode</button>
<button onclick="downloadImage()">Download PNG</button>

<input type="file" id="fileInput" accept="image/*">
<button onclick="uploadImage()">Upload Image</button>

<canvas id="canvas"></canvas>

<h3>Output</h3>
<div id="output"></div>

<script>

// CHANGE THIS KEY
const SECRET_KEY = "Codingiscool";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// XOR encrypt/decrypt
function crypt(data) {
    const keyBytes = new TextEncoder().encode(SECRET_KEY);

    const result = new Uint8Array(data.length);

    for (let i = 0; i < data.length; i++) {
        result[i] = data[i] ^ keyBytes[i % keyBytes.length];
    }

    return result;
}

// Encode text into image
function encodeText() {

    const text = document.getElementById("inputText").value;

    if (!text) {
        alert("Enter some text first.");
        return;
    }

    const textBytes = new TextEncoder().encode(text);
    const encrypted = crypt(textBytes);

    const length = encrypted.length;

    const payload = [

        // Magic bytes "TXT"
        84,
        88,
        84,

        // Length (4 bytes)
        (length >>> 24) & 255,
        (length >>> 16) & 255,
        (length >>> 8) & 255,
        length & 255,

        ...encrypted
    ];

    const pixelCount = Math.ceil(payload.length / 3);
    const size = Math.ceil(Math.sqrt(pixelCount));

    canvas.width = size;
    canvas.height = size;

    const imageData = ctx.createImageData(size, size);

    let payloadIndex = 0;

    for (let i = 0; i < imageData.data.length; i += 4) {

        imageData.data[i] =
            payload[payloadIndex++] ?? 0;

        imageData.data[i + 1] =
            payload[payloadIndex++] ?? 0;

        imageData.data[i + 2] =
            payload[payloadIndex++] ?? 0;

        imageData.data[i + 3] = 255;
    }

    ctx.putImageData(imageData, 0, 0);

    document.getElementById("output").textContent =
        "Encoding complete.";
}

// Decode image
function decodeImage() {

    if (canvas.width === 0 || canvas.height === 0) {
        alert("No image loaded.");
        return;
    }

    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const bytes = [];

    for (let i = 0; i < imageData.data.length; i += 4) {

        bytes.push(
            imageData.data[i],
            imageData.data[i + 1],
            imageData.data[i + 2]
        );
    }

    // Verify magic bytes
    if (
        bytes[0] !== 84 ||
        bytes[1] !== 88 ||
        bytes[2] !== 84
    ) {
        alert("Not a valid encoded image.");
        return;
    }

    const length =
        (((bytes[3] << 24) >>> 0)) +
        (bytes[4] << 16) +
        (bytes[5] << 8) +
        bytes[6];

    const encrypted =
        Uint8Array.from(
            bytes.slice(7, 7 + length)
        );

    const decrypted =
        crypt(encrypted);

    const text =
        new TextDecoder().decode(
            decrypted
        );

    document.getElementById("output").textContent =
        text;
    return text;
}
function run(){
    
  // Open a blank page
  let newWindow = window.open("about:blank", "_blank");

  // Write HTML into it
  newWindow.document.write(decodeImage());

  // Close the document stream so it renders
  newWindow.document.close();


}
// Download image
function downloadImage() {

    if (canvas.width === 0) {
        alert("Nothing to download.");
        return;
    }

    const link = document.createElement("a");

    link.download = "encrypted.png";
    link.href = canvas.toDataURL("image/png");

    link.click();
}

// Upload image
function uploadImage() {

    const file =
        document.getElementById("fileInput").files[0];

    if (!file) {
        alert("Choose an image first.");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {

        const img = new Image();

        img.onload = function() {

            canvas.width = img.width;
            canvas.height = img.height;

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.drawImage(img, 0, 0);

            document.getElementById("output").textContent =
                "Image loaded. Click Decode.";
        };

        img.src = event.target.result;
    };

    reader.readAsDataURL(file);
}

</script>

</body>
</html>
