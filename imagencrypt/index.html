<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Text ↔ Image Encoder</title>
<style>
body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 20px auto;
}

textarea {
    width: 100%;
    height: 120px;
}

canvas {
    border: 1px solid black;
    image-rendering: pixelated;
    width: 300px;
    height: 300px;
}

button {
    margin: 5px;
    padding: 8px 12px;
}
</style>
</head>
<body>

<h2>Text → Image Encoder</h2>

<textarea id="text" placeholder="Enter text here..."></textarea>
<br>

<button onclick="encodeText()">Encode</button>
<button onclick="decodeImage()">Decode</button>
<button onclick="downloadImage()">Download PNG</button>

<br><br>

<canvas id="canvas"></canvas>

<h3>Decoded Text</h3>
<pre id="output"></pre>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function encodeText() {
    const text = document.getElementById("text").value;

    const encoder = new TextEncoder();
    const bytes = encoder.encode(text);

    // Store length in first 4 bytes
    const length = bytes.length;

    const allBytes = [
        (length >> 24) & 255,
        (length >> 16) & 255,
        (length >> 8) & 255,
        length & 255,
        ...bytes
    ];

    const pixelCount = Math.ceil(allBytes.length / 3);
    const size = Math.ceil(Math.sqrt(pixelCount));

    canvas.width = size;
    canvas.height = size;

    const imageData = ctx.createImageData(size, size);

    let byteIndex = 0;

    for (let p = 0; p < size * size; p++) {
        const i = p * 4;

        imageData.data[i]     = allBytes[byteIndex++] ?? 0;
        imageData.data[i + 1] = allBytes[byteIndex++] ?? 0;
        imageData.data[i + 2] = allBytes[byteIndex++] ?? 0;
        imageData.data[i + 3] = 255;
    }

    ctx.putImageData(imageData, 0, 0);
}

function decodeImage() {
    const imageData = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const bytes = [];

    for (let i = 0; i < imageData.data.length; i += 4) {
        bytes.push(
            imageData.data[i],
            imageData.data[i + 1],
            imageData.data[i + 2]
        );
    }

    const length =
        (bytes[0] << 24) |
        (bytes[1] << 16) |
        (bytes[2] << 8) |
        bytes[3];

    const messageBytes = bytes.slice(4, 4 + length);

    const decoder = new TextDecoder();
    const text = decoder.decode(new Uint8Array(messageBytes));

    document.getElementById("output").textContent = text;
}

function downloadImage() {
    const link = document.createElement("a");
    link.download = "encoded-text.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}
</script>

</body>
</html>
